name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
      - name: Local D1 integration + browser regressions (keyless simulated, isolated local DB)
        run: |
          npx wrangler d1 migrations apply DB --local
          (npx wrangler dev --port 8787 --local --ip 127.0.0.1 --var AI_MODE:simulated > /tmp/wrangler.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/health && break || sleep 2; done
          node tests/integration.mjs
          BASE=http://127.0.0.1:8787 node eval/run.mjs
          npm i -g agent-browser
          agent-browser install
          BASE=http://127.0.0.1:8787 npm run test:browser
          pkill -f "wrangler dev" || true
